services:
  mysql:
    image: mysql:8.4
    container_name: forwisesaying15-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 최초 기동 시 개발/테스트 DB 와 테이블을 자동 생성
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  mysql-data:
